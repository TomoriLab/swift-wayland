name: WaylandKit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: x86_64 / ${{ matrix.configuration }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-wayland
      - name: Run Swift Testing suite
        run: swift test --configuration "${{ matrix.configuration }}" --disable-xctest -Xswiftc -warnings-as-errors
