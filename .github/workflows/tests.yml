name: WaylandKit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: x86_64 / ${{ matrix.configuration }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-wayland
      - name: Run Swift Testing suite
        shell: bash
        run: |
          mkdir -p .build/test-logs
          swift test --configuration "${{ matrix.configuration }}" --disable-xctest -Xswiftc -warnings-as-errors 2>&1 | tee ".build/test-logs/${{ matrix.configuration }}.log"
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waylandkit-tests-${{ matrix.configuration }}
          path: .build/test-logs/
          include-hidden-files: true
          retention-days: 14
