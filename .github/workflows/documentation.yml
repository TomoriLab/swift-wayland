name: Deploy DocC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-wayland
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static DocC site
        env:
          HOSTING_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 Scripts/build-documentation.py --hosting-base-path "$HOSTING_BASE_PATH"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/documentation/WaylandKit.doccarchive
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
